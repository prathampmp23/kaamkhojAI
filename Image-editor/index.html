<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <title>Image Editor</title>
</head>

<body>

    <main>
        <nav>
            <div class="navbar">
                <div class="left">Image Editor</div>
                <div class="right">
                    <label for="img-upload">
                        <i class="ri-file-image-line"></i>Choose Image
                        <input type="file" id="img-upload" accept="image/*" hidden>
                    </label>

                    <button class="btn" id="reset-button"><i class="ri-reset-left-line"></i> Reset</button>
                    <button class="btn" id="download-button"> <i class="ri-download-2-fill"></i> Download</button>
                </div>
            </div>
        </nav>



        <section>
            <div class="main-body">

                <div class="preview">               
                    <i class="ri-image-fill"></i>
                    <p>No Image Choosen, Yet !</p>
                    <canvas id="image-canvas"></canvas>
                </div>

                <div class="filters-container">
                    <h3>Filters</h3>

                    <hr>

                    <div class="range-filters">
                        <!-- Filters will be added here through javascript -->
                    </div>
                    
                    <h3>Presets</h3>
                    <hr>
                    <div class="presets">
                        
                        <!-- Preset button will be added here through javascript -->
                    </div>

                </div>
            </div>
        </section>

    </main>



    <script src="script.js"></script>
</body>

</html>
